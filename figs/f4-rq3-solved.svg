  </g>
  <g id="text_21">
   <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(6.912 32.779238)">Figure 4: in round one, every model solved more tasks with a thinking budget</text>
   <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(6.912 48.382793)">than without one</text>
  </g>
  <g id="text_22">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(6.912 68.499355)">round one, 144 runs, 6 models, 8 tasks per cell, no tools, one frozen limits file; a dashed line</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(6.912 81.702363)">is a model served at a provider</text>
  </g>
  <g id="text_23">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(6.912 336.762332)">Read pairwise on the same task: 8 model-task pairs disagree between a budget of none and one of medium,</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(6.912 349.96534)">and 8 of them go to medium. 1 model peaks at low and falls at medium, so the round supports the two</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(6.912 363.168348)">endpoints and not a monotone trend.</text>
  </g>
 </g>
